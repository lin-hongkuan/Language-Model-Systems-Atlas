<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="title desc">
  <title id="title">Decoder-only Transformer block</title>
  <desc id="desc">输入经过 RMSNorm、causal self-attention 和残差，然后经过 RMSNorm、SwiGLU 前馈网络和残差输出。</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9" fill="#315f91"/></marker>
    <style>text{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif;fill:#1d2b3a}.box{fill:#fff;stroke:#7294b5;stroke-width:2}.norm{fill:#eff4f9;stroke:#9cb2c8;stroke-width:2}.label{font-size:19px;font-weight:600}.small{font-size:15px;fill:#53677d}.res{fill:none;stroke:#668db7;stroke-width:2.5}</style>
  </defs>
  <rect width="900" height="500" rx="22" fill="#f7faff"/>
  <text x="450" y="40" text-anchor="middle" class="label">Pre-norm decoder block：注意力负责 token 间混合，FFN 逐位置变换</text>
  <rect class="box" x="350" y="430" width="200" height="48" rx="10"/><text x="450" y="461" class="label" text-anchor="middle">输入 X [B,T,D]</text>
  <rect class="norm" x="370" y="347" width="160" height="48" rx="9"/><text x="450" y="377" class="label" text-anchor="middle">RMSNorm</text>
  <rect class="box" x="325" y="253" width="250" height="60" rx="10"/><text x="450" y="280" class="label" text-anchor="middle">因果多头自注意力</text><text x="450" y="301" class="small" text-anchor="middle">跨位置混合上下文</text>
  <rect class="norm" x="370" y="166" width="160" height="48" rx="9"/><text x="450" y="196" class="label" text-anchor="middle">RMSNorm</text>
  <rect class="box" x="325" y="79" width="250" height="60" rx="10"/><text x="450" y="106" class="label" text-anchor="middle">SwiGLU FFN</text><text x="450" y="127" class="small" text-anchor="middle">逐位置变换通道</text>
  <path d="M450 430v-29M450 347v-26M450 253v-31M450 166v-20M450 79V57" stroke="#315f91" stroke-width="2.6" marker-end="url(#arrow)"/>
  <path d="M350 454H235V283H320M550 454H665V283H580M350 371H205V109H320M550 371H695V109H580" class="res"/>
  <circle cx="325" cy="283" r="15" fill="#dceaf7" stroke="#315f91" stroke-width="2"/><text x="325" y="289" text-anchor="middle" font-size="19" font-weight="700" fill="#315f91">+</text>
  <circle cx="575" cy="283" r="15" fill="#dceaf7" stroke="#315f91" stroke-width="2"/><text x="575" y="289" text-anchor="middle" font-size="19" font-weight="700" fill="#315f91">+</text>
  <text x="130" y="347" class="small">残差支路</text><text x="755" y="347" class="small">残差支路</text>
</svg>
