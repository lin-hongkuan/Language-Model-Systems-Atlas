<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 360" role="img" aria-labelledby="title desc">
  <title id="title">Skip-gram 中心词预测上下文</title>
  <desc id="desc">中心词 like 输入模型，分别预测左侧 I 和右侧 deep、learning 等上下文词。</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9" fill="#315f91"/></marker>
    <style>
      text{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif;fill:#1d2b3a}
      .small{font-size:18px;fill:#53677d}.label{font-size:20px;font-weight:600}.token{font-size:23px;font-weight:600}
    </style>
  </defs>
  <rect width="1120" height="360" rx="22" fill="#f7faff"/>
  <text x="560" y="44" text-anchor="middle" class="label">“I like deep learning” 中的 Skip-gram 窗口示意</text>
  <g transform="translate(90 106)">
    <rect width="130" height="66" rx="12" fill="#fff" stroke="#9cb2c8" stroke-width="2"/><text x="65" y="42" text-anchor="middle" class="token">I</text>
    <rect x="165" width="130" height="66" rx="12" fill="#dceaf7" stroke="#315f91" stroke-width="3"/><text x="230" y="42" text-anchor="middle" class="token">like</text>
    <rect x="330" width="130" height="66" rx="12" fill="#fff" stroke="#9cb2c8" stroke-width="2"/><text x="395" y="42" text-anchor="middle" class="token">deep</text>
    <rect x="495" width="130" height="66" rx="12" fill="#fff" stroke="#9cb2c8" stroke-width="2"/><text x="560" y="42" text-anchor="middle" class="token">learning</text>
    <text x="230" y="103" text-anchor="middle" class="small">中心词 c</text>
    <text x="67" y="103" text-anchor="middle" class="small">上下文 o₁</text>
    <text x="395" y="103" text-anchor="middle" class="small">上下文 o₂</text>
    <text x="560" y="103" text-anchor="middle" class="small">较远上下文（视窗口而定）</text>
  </g>
  <path d="M550 230v30" stroke="#315f91" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="380" y="266" width="360" height="54" rx="12" fill="#fff" stroke="#9cb2c8" stroke-width="2"/>
  <text x="560" y="301" text-anchor="middle" class="label">用中心词向量预测上下文词</text>
</svg>
