<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 390" role="img" aria-labelledby="title desc">
  <title id="title">RNN 按时间展开</title>
  <desc id="desc">RNN 在每个时间步读取 token embedding 和上一时刻隐藏状态，产生新隐藏状态与下一 token 概率，参数在时间步间共享。</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9" fill="#315f91"/></marker>
    <style>text{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif;fill:#1d2b3a}.node{fill:#fff;stroke:#7294b5;stroke-width:2}.state{fill:#dceaf7;stroke:#315f91;stroke-width:2}.label{font-size:19px;font-weight:600}.small{font-size:16px;fill:#53677d}</style>
  </defs>
  <rect width="1120" height="390" rx="22" fill="#f7faff"/>
  <text x="560" y="42" text-anchor="middle" class="label">同一组参数沿时间步重复使用，隐藏状态携带前文摘要</text>
  <g>
    <rect class="node" x="80" y="235" width="125" height="58" rx="10"/><text x="142" y="270" class="label" text-anchor="middle">embedding x₁</text>
    <rect class="node" x="365" y="235" width="125" height="58" rx="10"/><text x="427" y="270" class="label" text-anchor="middle">embedding x₂</text>
    <rect class="node" x="650" y="235" width="125" height="58" rx="10"/><text x="712" y="270" class="label" text-anchor="middle">embedding x₃</text>
    <rect class="state" x="80" y="108" width="125" height="70" rx="12"/><text x="142" y="150" class="label" text-anchor="middle">h₁ = f(x₁,h₀)</text>
    <rect class="state" x="365" y="108" width="125" height="70" rx="12"/><text x="427" y="150" class="label" text-anchor="middle">h₂ = f(x₂,h₁)</text>
    <rect class="state" x="650" y="108" width="125" height="70" rx="12"/><text x="712" y="150" class="label" text-anchor="middle">h₃ = f(x₃,h₂)</text>
    <path d="M142 235v-50M427 235v-50M712 235v-50" stroke="#315f91" stroke-width="2.5" marker-end="url(#arrow)"/>
    <path d="M205 143h150M490 143h150" stroke="#315f91" stroke-width="3" marker-end="url(#arrow)"/>
    <rect class="node" x="875" y="108" width="170" height="70" rx="12"/><text x="960" y="139" class="label" text-anchor="middle">softmax</text><text x="960" y="161" class="small" text-anchor="middle">P(xₜ₊₁ | x≤ₜ)</text>
    <path d="M775 143h94" stroke="#315f91" stroke-width="3" marker-end="url(#arrow)"/>
  </g>
  <rect x="270" y="322" width="465" height="42" rx="10" fill="#fff" stroke="#e1e8f0"/>
  <text x="502" y="349" text-anchor="middle" class="small">时间展开只是把共享参数的循环计算画成链</text>
</svg>
