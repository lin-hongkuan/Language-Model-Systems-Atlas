<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" role="img" aria-labelledby="title desc">
  <title id="title">四个 token 的 causal attention 可见性矩阵</title>
  <desc id="desc">位置 i 只能关注所有位置 j 小于等于 i 的 key；矩阵右上角未来位置被屏蔽。</desc>
  <defs><style>text{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif;fill:#1d2b3a}.head{font-size:21px;font-weight:600}.cell{font-size:17px;font-weight:600}.small{font-size:15px;fill:#52657a}</style></defs>
  <rect width="980" height="470" rx="22" fill="#f7faff"/>
  <text x="490" y="45" class="head" text-anchor="middle">Causal mask：当前 token 不能读取未来 token</text>
  <text x="488" y="91" class="small" text-anchor="middle">Key / 被读取的位置 j →</text>
  <text x="154" y="265" class="small" text-anchor="middle" transform="rotate(-90 154 265)">Query / 发起读取的位置 i →</text>
  <g class="small" text-anchor="middle">
    <text x="310" y="131">1</text><text x="400" y="131">2</text><text x="490" y="131">3</text><text x="580" y="131">4</text>
    <text x="225" y="184">i=1</text><text x="225" y="264">i=2</text><text x="225" y="344">i=3</text><text x="225" y="424">i=4</text>
  </g>
  <g stroke="#fff" stroke-width="4">
    <rect x="265" y="146" width="90" height="70" rx="8" fill="#315f91"/><rect x="355" y="146" width="90" height="70" rx="8" fill="#e4e8ec"/><rect x="445" y="146" width="90" height="70" rx="8" fill="#e4e8ec"/><rect x="535" y="146" width="90" height="70" rx="8" fill="#e4e8ec"/>
    <rect x="265" y="226" width="90" height="70" rx="8" fill="#315f91"/><rect x="355" y="226" width="90" height="70" rx="8" fill="#315f91"/><rect x="445" y="226" width="90" height="70" rx="8" fill="#e4e8ec"/><rect x="535" y="226" width="90" height="70" rx="8" fill="#e4e8ec"/>
    <rect x="265" y="306" width="90" height="70" rx="8" fill="#315f91"/><rect x="355" y="306" width="90" height="70" rx="8" fill="#315f91"/><rect x="445" y="306" width="90" height="70" rx="8" fill="#315f91"/><rect x="535" y="306" width="90" height="70" rx="8" fill="#e4e8ec"/>
    <rect x="265" y="386" width="90" height="70" rx="8" fill="#315f91"/><rect x="355" y="386" width="90" height="70" rx="8" fill="#315f91"/><rect x="445" y="386" width="90" height="70" rx="8" fill="#315f91"/><rect x="535" y="386" width="90" height="70" rx="8" fill="#315f91"/>
  </g>
  <g class="cell" text-anchor="middle">
    <text x="310" y="190" fill="#fff">可见</text><text x="400" y="190">屏蔽</text><text x="490" y="190">屏蔽</text><text x="580" y="190">屏蔽</text>
    <text x="310" y="270" fill="#fff">可见</text><text x="400" y="270" fill="#fff">可见</text><text x="490" y="270">屏蔽</text><text x="580" y="270">屏蔽</text>
    <text x="310" y="350" fill="#fff">可见</text><text x="400" y="350" fill="#fff">可见</text><text x="490" y="350" fill="#fff">可见</text><text x="580" y="350">屏蔽</text>
    <text x="310" y="430" fill="#fff">可见</text><text x="400" y="430" fill="#fff">可见</text><text x="490" y="430" fill="#fff">可见</text><text x="580" y="430" fill="#fff">可见</text>
  </g>
  <g transform="translate(700 190)"><rect width="18" height="18" rx="4" fill="#315f91"/><text x="28" y="15" class="small">可见位置 j ≤ i</text><rect y="38" width="18" height="18" rx="4" fill="#e4e8ec"/><text x="28" y="53" class="small">未来位置 j &gt; i</text></g>
</svg>
