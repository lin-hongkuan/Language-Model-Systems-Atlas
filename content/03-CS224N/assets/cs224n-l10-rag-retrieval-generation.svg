<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 430" role="img" aria-labelledby="title desc">
  <title id="title">RAG 检索增强生成流程</title>
  <desc id="desc">文档经切片和向量化建立索引，用户问题生成查询表示后检索相关片段，将问题与证据交给语言模型，再检查回答和引用是否受证据支持。</desc>
  <defs>
    <marker id="arrow-l10" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#3977c3"/>
    </marker>
    <style>
      .bg{fill:#f7fbff}.box{fill:#fff;stroke:#bed4ef;stroke-width:2}
      .primary{fill:#e8f2ff;stroke:#3977c3;stroke-width:2}
      .title{font:700 25px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#163b66}
      .label{font:700 18px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#173e6a}
      .small{font:15px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#52677f}
      .line{stroke:#3977c3;stroke-width:3;fill:none;marker-end:url(#arrow-l10)}
      .dash{stroke:#82a9d8;stroke-width:2.5;stroke-dasharray:7 6;fill:none;marker-end:url(#arrow-l10)}
    </style>
  </defs>
  <rect class="bg" width="1280" height="430" rx="22"/>
  <text class="title" x="54" y="54">RAG：先找证据，再组织回答</text>

  <rect class="box" x="55" y="93" width="190" height="78" rx="15"/>
  <text class="label" x="150" y="126" text-anchor="middle">文档集合</text>
  <text class="small" x="150" y="150" text-anchor="middle">版本与来源保留</text>
  <rect class="primary" x="320" y="93" width="240" height="78" rx="15"/>
  <text class="label" x="440" y="126" text-anchor="middle">切片 · 编码 · 建索引</text>
  <text class="small" x="440" y="150" text-anchor="middle">文档向量 / 关键词</text>
  <rect class="box" x="635" y="93" width="190" height="78" rx="15"/>
  <text class="label" x="730" y="126" text-anchor="middle">检索索引</text>
  <text class="small" x="730" y="150" text-anchor="middle">存储候选片段</text>
  <path class="line" d="M246 132 H312"/><path class="line" d="M561 132 H627"/>

  <rect class="box" x="55" y="264" width="190" height="78" rx="15"/>
  <text class="label" x="150" y="297" text-anchor="middle">用户问题</text>
  <text class="small" x="150" y="321" text-anchor="middle">查询条件</text>
  <rect class="box" x="320" y="264" width="240" height="78" rx="15"/>
  <text class="label" x="440" y="297" text-anchor="middle">查询表示</text>
  <text class="small" x="440" y="321" text-anchor="middle">向量或关键词</text>
  <rect class="primary" x="635" y="264" width="190" height="78" rx="15"/>
  <text class="label" x="730" y="297" text-anchor="middle">取回 Top-k</text>
  <text class="small" x="730" y="321" text-anchor="middle">相关片段 + 元数据</text>
  <rect class="box" x="890" y="264" width="170" height="78" rx="15"/>
  <text class="label" x="975" y="297" text-anchor="middle">生成回答</text>
  <text class="small" x="975" y="321" text-anchor="middle">问题 + 证据上下文</text>
  <rect class="primary" x="1090" y="264" width="155" height="78" rx="15"/>
  <text class="label" x="1167" y="297" text-anchor="middle">核查引用</text>
  <text class="small" x="1167" y="321" text-anchor="middle">证据是否支持？</text>
  <path class="line" d="M246 303 H312"/><path class="line" d="M561 303 H627"/>
  <path class="line" d="M826 303 H882"/><path class="line" d="M1061 303 H1082"/>
  <path class="dash" d="M730 172 V254"/>
  <rect x="55" y="373" width="1190" height="34" rx="10" fill="#eaf3ff"/>
  <text class="small" x="650" y="396" text-anchor="middle">检索到资料不等于答案正确：还要检查召回、排序、证据使用与引用。</text>
</svg>
