<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 390" role="img" aria-labelledby="title desc">
  <title id="title">CS336 讲次主题与作业依赖关系</title>
  <desc id="desc">课程讲次围绕 A1 基础模型、A2 系统、A3 scaling、A4 数据、A5 对齐展开；主题依次依赖。</desc>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9" fill="#315f91"/></marker><style>text{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif;fill:#1d2b3a}.a{font-size:21px;font-weight:700}.t{font-size:16px;font-weight:600}.s{font-size:13px;fill:#53677d}.white{fill:#fff}</style></defs>
  <rect width="1150" height="390" rx="22" fill="#f7faff"/>
  <text x="575" y="42" text-anchor="middle" class="t">课程讲次解释主题，作业把主题变成可检查的工程任务</text>
  <g>
    <g transform="translate(40 112)"><rect width="190" height="116" rx="13" fill="#e8f1f8" stroke="#668db7" stroke-width="2"/><text x="95" y="40" text-anchor="middle" class="a">A1 · Basics</text><text x="95" y="70" text-anchor="middle" class="s">L01-L03</text><text x="95" y="94" text-anchor="middle" class="s">tokenizer / Transformer / train</text></g>
    <g transform="translate(270 112)"><rect width="190" height="116" rx="13" fill="#fff" stroke="#9cb2c8" stroke-width="2"/><text x="95" y="40" text-anchor="middle" class="a">A2 · Systems</text><text x="95" y="70" text-anchor="middle" class="s">L04-L08</text><text x="95" y="94" text-anchor="middle" class="s">kernel / 并行 / 性能</text></g>
    <g transform="translate(500 112)"><rect width="190" height="116" rx="13" fill="#fff" stroke="#9cb2c8" stroke-width="2"/><text x="95" y="40" text-anchor="middle" class="a">A3 · Scaling</text><text x="95" y="70" text-anchor="middle" class="s">L09-L12</text><text x="95" y="94" text-anchor="middle" class="s">规模规律 / 推理 / 评估</text></g>
    <g transform="translate(730 112)"><rect width="190" height="116" rx="13" fill="#fff" stroke="#9cb2c8" stroke-width="2"/><text x="95" y="40" text-anchor="middle" class="a">A4 · Data</text><text x="95" y="70" text-anchor="middle" class="s">L13-L14</text><text x="95" y="94" text-anchor="middle" class="s">过滤 / 去重 / 混配</text></g>
    <g transform="translate(960 112)"><rect width="155" height="116" rx="13" fill="#315f91" stroke="#315f91" stroke-width="2"/><text x="77" y="40" text-anchor="middle" class="a white">A5 · Alignment</text><text x="77" y="70" text-anchor="middle" class="s white">L15-L17</text><text x="77" y="94" text-anchor="middle" class="s white">SFT / RL / 多模态</text></g>
  </g>
  <g stroke="#668db7" stroke-width="2.4" marker-end="url(#arrow)"><path d="M230 170h32"/><path d="M460 170h32"/><path d="M690 170h32"/><path d="M920 170h32"/></g>
  <rect x="180" y="282" width="790" height="54" rx="12" fill="#fff" stroke="#e1e8f0"/>
