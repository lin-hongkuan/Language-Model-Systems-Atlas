<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 330" role="img" aria-labelledby="title desc">
  <title id="title">CS336 A1 小型语言模型训练流程</title>
  <desc id="desc">原始文本经过 UTF-8 和 BPE 编码，形成 batch，进入 Transformer 预测 logits，与错位目标计算交叉熵，再反向更新参数并验证。</desc>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9" fill="#315f91"/></marker><style>text{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif;fill:#1d2b3a}.b{font-size:17px;font-weight:600}.s{font-size:13px;fill:#53677d}</style></defs>
  <rect width="1120" height="330" rx="20" fill="#f7faff"/>
  <text x="560" y="39" text-anchor="middle" class="b">一次 next-token 训练步：数据对齐、形状与更新顺序都要可解释</text>
  <g>
    <g transform="translate(40 105)"><rect width="130" height="80" rx="12" fill="#fff" stroke="#9cb2c8" stroke-width="2"/><text x="65" y="34" text-anchor="middle" class="b">文本</text><text x="65" y="58" text-anchor="middle" class="s">UTF-8 bytes</text></g>
    <g transform="translate(220 105)"><rect width="130" height="80" rx="12" fill="#fff" stroke="#9cb2c8" stroke-width="2"/><text x="65" y="34" text-anchor="middle" class="b">BPE</text><text x="65" y="58" text-anchor="middle" class="s">token IDs</text></g>
    <g transform="translate(400 105)"><rect width="130" height="80" rx="12" fill="#fff" stroke="#9cb2c8" stroke-width="2"/><text x="65" y="34" text-anchor="middle" class="b">batch</text><text x="65" y="58" text-anchor="middle" class="s">input / target</text></g>
    <g transform="translate(580 105)"><rect width="145" height="80" rx="12" fill="#eff4f9" stroke="#668db7" stroke-width="2"/><text x="72" y="34" text-anchor="middle" class="b">Transformer</text><text x="72" y="58" text-anchor="middle" class="s">logits [B,T,V]</text></g>
    <g transform="translate(775 105)"><rect width="130" height="80" rx="12" fill="#eff4f9" stroke="#668db7" stroke-width="2"/><text x="65" y="34" text-anchor="middle" class="b">Cross-entropy</text><text x="65" y="58" text-anchor="middle" class="s">loss vs target</text></g>
    <g transform="translate(955 105)"><rect width="125" height="80" rx="12" fill="#dceaf7" stroke="#315f91" stroke-width="2"/><text x="62" y="34" text-anchor="middle" class="b">AdamW</text><text x="62" y="58" text-anchor="middle" class="s">update θ</text></g>
    <path d="M170 145h43M350 145h43M530 145h44M725 145h44M905 145h43" stroke="#315f91" stroke-width="2.5" marker-end="url(#arrow)"/>
  </g>
  <path d="M1017 201v62H652v-62" fill="none" stroke="#668db7" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
  <text x="835" y="290" text-anchor="middle" class="s">验证集监控 · checkpoint 保存与恢复 · 逐 token 生成</text>
</svg>
