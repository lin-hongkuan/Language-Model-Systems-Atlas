<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 570" role="img" aria-labelledby="title desc">
  <title id="title">A1：从原始文本到语言模型参数更新</title>
  <desc id="desc">六步训练流程：文本经 UTF-8 和 BPE 成为 token ID，错位构成输入与目标，Transformer 生成 logits，交叉熵反向传播得到梯度，AdamW 更新参数。验证和生成从已训练模型分支。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#537aa8"/></marker>
    <linearGradient id="wash" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#e9f2ff"/></linearGradient>
  </defs>
  <rect width="900" height="570" rx="28" fill="url(#wash)"/>
  <text x="38" y="42" font-family="Inter, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="700" letter-spacing="2" fill="#6382a9">TRAINING DATA FLOW</text>
  <g fill="none" stroke="#537aa8" stroke-width="3" marker-end="url(#arrow)">
    <path d="M425 135H475"/><path d="M680 170V210"/><path d="M475 285H425"/><path d="M220 320V360"/><path d="M425 435H475"/>
  </g>
  <g font-family="Inter, Noto Sans CJK SC, Microsoft YaHei, sans-serif">
    <g><rect x="35" y="70" width="390" height="100" rx="18" fill="#fff" stroke="#c6d8ee" stroke-width="2"/><circle cx="68" cy="103" r="17" fill="#e7f0ff"/><text x="68" y="109" text-anchor="middle" font-size="15" font-weight="700" fill="#205da8">1</text><text x="98" y="108" font-size="21" font-weight="700" fill="#183252">语料文本</text><text x="62" y="143" font-size="16" fill="#536a84">清洗、切分；训练集与验证集分开</text></g>
    <g><rect x="475" y="70" width="390" height="100" rx="18" fill="#fff" stroke="#b7ccec" stroke-width="2"/><circle cx="508" cy="103" r="17" fill="#e7f0ff"/><text x="508" y="109" text-anchor="middle" font-size="15" font-weight="700" fill="#205da8">2</text><text x="538" y="108" font-size="21" font-weight="700" fill="#183252">UTF-8 → BPE</text><text x="502" y="143" font-size="16" fill="#536a84">文本变成 byte 片段与 token ID</text></g>
    <g><rect x="475" y="220" width="390" height="100" rx="18" fill="#fff" stroke="#b7ccec" stroke-width="2"/><circle cx="508" cy="253" r="17" fill="#e7f0ff"/><text x="508" y="259" text-anchor="middle" font-size="15" font-weight="700" fill="#205da8">3</text><text x="538" y="258" font-size="21" font-weight="700" fill="#183252">错开一位</text><text x="502" y="293" font-size="16" fill="#536a84">input 预测下一 token，得到 target</text></g>
    <g><rect x="35" y="220" width="390" height="100" rx="18" fill="#fff" stroke="#b7ccec" stroke-width="2"/><circle cx="68" cy="253" r="17" fill="#e7f0ff"/><text x="68" y="259" text-anchor="middle" font-size="15" font-weight="700" fill="#205da8">4</text><text x="98" y="258" font-size="21" font-weight="700" fill="#183252">Transformer</text><text x="62" y="293" font-size="16" fill="#536a84">因果注意力产生词表 logits</text></g>
    <g><rect x="35" y="370" width="390" height="100" rx="18" fill="#fff" stroke="#b7ccec" stroke-width="2"/><circle cx="68" cy="403" r="17" fill="#e7f0ff"/><text x="68" y="409" text-anchor="middle" font-size="15" font-weight="700" fill="#205da8">5</text><text x="98" y="408" font-size="21" font-weight="700" fill="#183252">loss → backward</text><text x="62" y="443" font-size="16" fill="#536a84">对照正确 token，计算梯度</text></g>
    <g><rect x="475" y="370" width="390" height="100" rx="18" fill="#fff" stroke="#9ebce3" stroke-width="2"/><circle cx="508" cy="403" r="17" fill="#dceaff"/><text x="508" y="409" text-anchor="middle" font-size="15" font-weight="700" fill="#205da8">6</text><text x="538" y="408" font-size="21" font-weight="700" fill="#183252">AdamW → 参数</text><text x="502" y="443" font-size="16" fill="#536a84">更新后继续训练，或用于验证与生成</text></g>
  </g>
  <path d="M670 470V515H20V120H35" fill="none" stroke="#93aac6" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arrow)"/>
  <text x="470" y="543" text-anchor="middle" font-family="Inter, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="16" fill="#526c89">回到新 batch 重复训练；验证时不更新参数</text>
</svg>
