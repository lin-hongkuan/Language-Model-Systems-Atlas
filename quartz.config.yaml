configuration:
  pageTitle: Language Model Systems Atlas
  pageTitleSuffix: ' | 语言模型系统图谱'
  enableSPA: true
  enablePopovers: true
  locale: zh-CN
  baseUrl: blog.linhk.top/Language-Model-Systems-Atlas
  ignorePatterns:
  - private
  - templates
  - .obsidian
  - 98-Local-Study-Cache
  - private-materials
  theme:
    fontOrigin: local
    cdnCaching: false
    typography:
      header: Noto Serif SC
      body: Noto Sans SC
      code: Cascadia Code
    colors:
      lightMode:
        light: '#f7faff'
        lightgray: '#e1e8f0'
        gray: '#aab7c6'
        darkgray: '#3f5268'
        dark: '#1d2b3a'
        secondary: '#315f91'
        tertiary: '#668db7'
        highlight: rgba(49,95,145,0.11)
        textHighlight: '#f0d36a66'
      darkMode:
        light: '#171d25'
        lightgray: '#354252'
        gray: '#78889a'
        darkgray: '#ccd6e1'
        dark: '#edf3f9'
        secondary: '#87b5e1'
        tertiary: '#a4c3e1'
        highlight: rgba(135,181,225,0.15)
        textHighlight: '#e0c76566'
plugins:
- source: '@quartz-community/created-modified-date'
  enabled: true
  options:
    defaultDateType: modified
    priority:
    - frontmatter
    - filesystem
  order: 10
- source: '@quartz-community/syntax-highlighting'
  enabled: true
  options:
    theme:
      light: github-light
      dark: github-dark
    keepBackground: false
  order: 20
- source: '@quartz-community/obsidian-flavored-markdown'
  enabled: true
  options:
    enableInHtmlEmbed: false
    enableCheckbox: true
  order: 30
- source: '@quartz-community/github-flavored-markdown'
  enabled: true
  order: 40
- source: '@quartz-community/table-of-contents'
  enabled: true
  order: 50
  layout:
    position: right
    priority: 30
- source: '@quartz-community/crawl-links'
  enabled: true
  options:
    markdownLinkResolution: shortest
  order: 60
- source: '@quartz-community/description'
  enabled: true
  order: 70
- source: '@quartz-community/latex'
  enabled: true
  options:
    renderEngine: mathjax
  order: 80
- source: '@quartz-community/citations'
  enabled: false
  order: 85
- source: '@quartz-community/hard-line-breaks'
  enabled: false
  order: 90
- source: '@quartz-community/ox-hugo'
  enabled: false
  order: 91
- source: '@quartz-community/roam'
  enabled: false
  order: 92
- source: '@quartz-community/quartz-fonts'
  enabled: false
- source: '@quartz-themes/core'
  enabled: false
  options:
    theme: tokyo-night
    mode: both
- source: '@quartz-community/remove-draft'
  enabled: true
- source: '@quartz-community/explicit-publish'
  enabled: false
- source: '@quartz-community/alias-redirects'
  enabled: true
- source: '@quartz-community/content-index'
  enabled: true
  options:
    enableSiteMap: true
    enableRSS: true
- source: '@quartz-community/favicon'
  enabled: true
- source: '@quartz-community/og-image'
  enabled: true
- source: '@quartz-community/cname'
  enabled: false
- source: '@quartz-community/canvas-page'
  enabled: true
- source: '@quartz-community/content-page'
  enabled: true
- source: '@quartz-community/folder-page'
  enabled: true
- source: '@quartz-community/tag-page'
  enabled: true
- source: '@quartz-community/explorer'
  enabled: true
  layout:
    position: left
    priority: 50
- source: '@quartz-community/graph'
  enabled: false
  layout:
    position: right
    priority: 10
- source: '@quartz-community/search'
  enabled: true
  layout:
    position: header
    priority: 10
    group: toolbar
    groupOptions:
      grow: true
- source: '@quartz-community/backlinks'
  enabled: false
  layout:
    position: right
    priority: 50
- source: '@quartz-community/article-title'
  enabled: true
  layout:
    position: beforeBody
    priority: 10
- source: '@quartz-community/content-meta'
  enabled: false
  layout:
    position: beforeBody
    priority: 20
- source: '@quartz-community/tag-list'
  enabled: false
  layout:
    position: beforeBody
    priority: 30
- source: '@quartz-community/page-title'
  enabled: true
  layout:
    position: header
    priority: 10
- source: '@quartz-community/darkmode'
  enabled: true
  layout:
    position: header
    priority: 20
    group: toolbar
- source: '@quartz-community/reader-mode'
  enabled: true
  layout:
    position: header
    priority: 30
    group: toolbar
- source: '@quartz-community/breadcrumbs'
  enabled: true
  layout:
    position: beforeBody
    priority: 5
    condition: not-index
- source: '@quartz-community/comments'
  enabled: false
  options:
    provider: giscus
    options: {}
  layout:
    position: afterBody
    priority: 10
- source: '@quartz-community/footer'
  enabled: true
  options:
    links:
      Stanford CS224N: https://web.stanford.edu/class/cs224n/
      Stanford CS336: https://cs336.stanford.edu/
  layout:
    position: footer
    priority: 50
- source: '@quartz-community/recent-notes'
  enabled: false
- source: '@quartz-community/spacer'
  enabled: true
  options: {}
  order: 25
  layout:
    position: left
    priority: 25
    display: mobile-only
- source: '@quartz-community/bases-page'
  enabled: true
  options: {}
  order: 50
- source: '@quartz-community/note-properties'
  enabled: true
  options:
    includeAll: false
    includedProperties: []
    excludedProperties: []
    hidePropertiesView: true
    delimiters: '---'
    language: yaml
  order: 5
  layout:
    position: beforeBody
    priority: 15
- source: '@quartz-community/unlisted-pages'
  enabled: true
  options: {}
  order: 45
- source: '@quartz-community/encrypted-pages'
  enabled: true
  options:
    iterations: 600000
    passwordField: password
    unlistWhenEncrypted: false
    outputPath: static/encryptedContentIndex.json
  order: 900
- source: '@quartz-community/stacked-pages'
  enabled: false
  layout:
    position: afterBody
    priority: 50
    display: all
layout:
  groups:
    toolbar:
      priority: 35
      direction: row
      gap: 0.5rem
  byPageType:
    '404':
      positions:
        beforeBody: []
        left: []
        right: []
    content: {}
    folder:
      exclude:
      - reader-mode
      positions:
        right: []
    tag:
      exclude:
      - reader-mode
      positions:
        right: []
    canvas: {}
    bases: {}
