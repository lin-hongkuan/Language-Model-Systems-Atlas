name: Build and deploy atlas

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build public content
        run: npx quartz build

      - name: Ensure private study cache is absent
        shell: bash
        run: |
          test ! -e public/static/private-materials
          test ! -e public/98-Local-Study-Cache
          test ! -e public/98-local-study-cache
          test -f public/06-hands-on-llm/source/license
          test -f public/03-cs224n/2024-cc-by-nc-sa-4.0/license
          test "$(find public/03-cs224n/2024-cc-by-nc-sa-4.0/pdf -maxdepth 1 -type f -name '*.pdf' | wc -l)" -eq 14
          test "$(find public/03-cs224n/2024-cc-by-nc-sa-4.0/tex -maxdepth 1 -type f -name '*.tex' | wc -l)" -eq 14
          for dataset in \
            public/06-hands-on-llm/source/03-peft-framework/experiments/align_lab/data/pref_dpo_train.json \
            public/06-hands-on-llm/source/03-peft-framework/experiments/align_lab/data/pref_dpo_eval.json \
            public/06-hands-on-llm/source/03-peft-framework/experiments/peft_lab/data/zh_instruct_train.json \
            public/06-hands-on-llm/source/03-peft-framework/experiments/peft_lab/data/zh_instruct_eval.json; do
            test ! -e "$dataset"
          done
          if grep -R -E 'dihengye\.cn/slide-images|private-study-cache' public --include='*.html' --include='*.json'; then
            echo "Private study material leaked into the public output."
            exit 1
          fi

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
