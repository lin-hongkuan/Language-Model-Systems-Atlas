name: Build and deploy atlas

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build public content
        run: npx quartz build

      - name: Ensure private study cache is absent
        shell: bash
        run: |
          test ! -e public/static/private-materials
          test ! -e public/98-local-study-cache
          if grep -R -E 'dihengye\.cn/slide-images|private-study-cache' public --include='*.html' --include='*.json'; then
            echo "Private study material leaked into the public output."
            exit 1
          fi

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
